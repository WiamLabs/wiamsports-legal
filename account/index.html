<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta name="description" content="Your WiamArena account — profile, follows, saved stories, and settings.">
  <title>Account — WiamArena</title>
  <link rel="icon" href="/logo.png" type="image/png">
  <link rel="stylesheet" href="/legal.css?v=54">
  <link rel="stylesheet" href="/engines.css">
  <link rel="stylesheet" href="/boards.css?v=54">
</head>
<body>
  <div class="wrap wrap-wide">
    <header class="site-head">
      <a class="masthead" href="/">
        <img class="brand-mark" src="/logo.png" alt="WiamArena by WiamLabs">
      </a>
      <nav class="topnav" data-nav="account"></nav>
    </header>
    <div class="badge">Your account</div>
    <h1>WiamArena</h1>
    <p class="subtitle" id="sub">Loading…</p>
    <nav class="dash-nav" id="acct-nav" aria-label="Account"></nav>
    <p class="msg" id="msg"></p>
    <div id="acct-main">
      <div class="stat-grid">
        <div class="stat"><div class="k">Likes</div><div class="v" id="likes">—</div></div>
        <div class="stat"><div class="k">Saved</div><div class="v" id="saved">—</div></div>
        <div class="stat"><div class="k">Clubs</div><div class="v" id="follows">—</div></div>
        <div class="stat"><div class="k">Desks</div><div class="v" id="topics">—</div></div>
      </div>
      <section>
        <h2>Shortcuts</h2>
        <div class="dash-actions">
          <a class="btn" href="/account/profile/">Profile</a>
          <a class="btn" href="/account/follows/">Follows</a>
          <a class="btn" href="/account/saved/">Saved stories</a>
          <a class="btn" href="/follow/">Pick clubs</a>
          <a class="btn" href="/account/api/">API key</a>
        </div>
      </section>
    </div>
    <footer>
      <img class="brand-mark footer-mark" src="/logo.png" alt="WiamArena">
      <p>© 2026 WiamLabs. Bet responsibly. 18+.</p>
    </footer>
  </div>
  <script src="/config.js"></script>
  <script src="/auth.js?v=54"></script>
  <script src="/account/account.js?v=54"></script>
  <script>
    WiamAccount.paintNav("home");
    WiamAccount.load().then(function (data) {
      if (!WiamAccount.needVerified(data, document.getElementById("sub"))) return;
      var name = data.full_name || data.email || "there";
      document.getElementById("sub").textContent = "Welcome back, " + name + ".";
      var r = data.reader || {};
      WiamAccount.setText("likes", r.likes);
      WiamAccount.setText("saved", r.saved);
      WiamAccount.setText("follows", r.follows);
      WiamAccount.setText("topics", (r.topics || []).length);
    }).catch(function () {
      document.getElementById("msg").className = "msg err";
      document.getElementById("msg").textContent = "Could not load your account.";
    });
  </script>
</body>
</html>
