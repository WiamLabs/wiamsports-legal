<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Follows — WiamArena</title>
  <link rel="icon" href="/logo.png" type="image/png">
  <link rel="stylesheet" href="/legal.css?v=54">
  <link rel="stylesheet" href="/engines.css">
</head>
<body>
  <div class="wrap wrap-wide">
    <header class="site-head">
      <a class="masthead" href="/"><img class="brand-mark" src="/logo.png" alt="WiamArena"></a>
      <nav class="topnav" data-nav="account"></nav>
    </header>
    <div class="badge">Account</div>
    <h1>Follows</h1>
    <p class="subtitle" id="sub">Clubs and desks you follow.</p>
    <nav class="dash-nav" id="acct-nav" aria-label="Account"></nav>
    <div id="acct-main">
      <section>
        <h2>Clubs</h2>
        <div id="clubs"><p class="note">Loading…</p></div>
        <p class="note"><a href="/follow/">Pick more clubs</a></p>
      </section>
      <section>
        <h2>Desks</h2>
        <div id="topics"><p class="note">Loading…</p></div>
      </section>
    </div>
    <footer><p>© 2026 WiamLabs. 18+.</p></footer>
  </div>
  <script src="/config.js"></script>
  <script src="/auth.js?v=54"></script>
  <script src="/account/account.js?v=54"></script>
  <script>
    WiamAccount.paintNav("follows");
    WiamAccount.load().then(function (data) {
      if (!WiamAccount.needVerified(data, document.getElementById("sub"))) return;
      return Promise.all([
        fetch(WiamAuth.api() + "/v1/public/follow", { headers: WiamAuth.headers() }).then(function (r) { return r.json(); }),
        fetch(WiamAuth.api() + "/v1/public/news/reader", { headers: WiamAuth.headers() }).then(function (r) { return r.json(); }),
      ]);
    }).then(function (pack) {
      if (!pack) return;
      var clubs = (pack[0] && pack[0].teams) || [];
      var topics = (pack[1] && pack[1].topics) || [];
      var clubBox = document.getElementById("clubs");
      clubBox.innerHTML = clubs.length
        ? "<ul>" + clubs.map(function (r) { return "<li>" + (r.team || "") + "</li>"; }).join("") + "</ul>"
        : "<p class=\"note\">No clubs yet.</p>";
      var topicBox = document.getElementById("topics");
      topicBox.innerHTML = topics.length
        ? "<ul>" + topics.map(function (t) {
            var label = (t.desk ? t.desk + " " : "") + (t.sport || "") + (t.category ? " · " + t.category : "");
            return "<li>" + label + "</li>";
          }).join("") + "</ul>"
        : "<p class=\"note\">Follow a football desk from a category page.</p>";
    });
  </script>
</body>
</html>
